services:
  - type: web
    name: smart-academic-backend
    runtime: node
    region: singapore          # closest to Philippines; change if needed
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # --- Add the rest in Render Dashboard → Environment → Secret Files ---
      # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME,
      # DB_SSL_REJECT_UNAUTHORIZED, JWT_SECRET, JWT_EXPIRES_IN,
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
      # GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
      # GOOGLE_OAUTH_REDIRECT_URI, MAIL_USER, MAIL_PASS
