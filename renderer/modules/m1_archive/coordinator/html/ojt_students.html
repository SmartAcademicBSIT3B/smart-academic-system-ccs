<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJT Students</title>
    <link rel="stylesheet" href="../css/ojt_students.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="../js/ojt_report_export.js"></script>
    <style>
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .page-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .page-subtitle {
        color: var(--secondary-text);
        font-size: 13px;
        line-height: 1.45;
      }
      .section-report-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid rgba(157, 198, 255, 0.3);
        background: rgba(157, 198, 255, 0.08);
        color: var(--primary-text);
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .section-report-btn:hover {
        border-color: var(--accent-blue);
        color: #fff;
      }
      .section-report-btn svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
      }
      .loading-state,
      .empty-state {
        color: var(--secondary-text);
        font-size: 15px;
        padding: 40px;
      }
    </style>
  </head>

  <body>
    <div class="page-head">
      <div class="page-title-wrap">
        <h2 class="page-title">OJT STUDENTS</h2>
        <div class="page-subtitle">
          Generate a live PDF report for your assigned sections.
        </div>
      </div>
      <button type="button" class="section-report-btn" id="sectionPdfReportBtn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9V2h12v7"></path>
          <path
            d="M6 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1"
          ></path>
          <rect x="6" y="14" width="12" height="8" rx="1"></rect>
        </svg>
        Generate PDF Report
      </button>
    </div>

    <div id="sectionCards" class="ojt-container">
      <div class="loading-state">Loading your sections…</div>
    </div>

    <script>
      async function loadSections() {
        const container = document.getElementById("sectionCards");

        try {
          const result = await getApi().getCoordinatorSections();
          if (!result?.success)
            throw new Error(result?.message || "Failed to load sections.");

          const sections = result.sections || [];
          if (!sections.length) {
            container.innerHTML =
              '<div class="empty-state">No sections assigned to you yet.</div>';
            return;
          }

          container.innerHTML = sections
            .map(
              (s) => `
            <div class="student-card" data-section="${escapeAttr(s.section_name)}">
              <div class="course">${escapeHtml(s.section_name)}</div>
              <div class="divider"></div>
              <div class="students-count">
                <strong>${Number(s.student_count) || 0}</strong> student${s.student_count !== 1 ? "s" : ""}
              </div>
            </div>`,
            )
            .join("");

          container.querySelectorAll(".student-card").forEach(function (card) {
            card.addEventListener("click", function () {
              const section = this.dataset.section;
              window.location.href =
                "ojt_students_list.html?section=" + encodeURIComponent(section);
            });
          });
        } catch (err) {
          container.innerHTML =
            '<div class="empty-state">Error: ' +
            escapeHtml(err.message) +
            "</div>";
        }
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(str) {
        return String(str || "").replace(/"/g, "&quot;");
      }

      function getApi() {
        if (window.electronAPI) return window.electronAPI;
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.electronAPI
          )
            return window.parent.electronAPI;
        } catch (_) {}
        try {
          if (window.top && window.top !== window && window.top.electronAPI)
            return window.top.electronAPI;
        } catch (_) {}
        return {};
      }

      if (window.OjtCoordinatorReport) {
        window.OjtCoordinatorReport.initSectionReport({ getApi });
      }

      loadSections();
    </script>
  </body>
</html>
