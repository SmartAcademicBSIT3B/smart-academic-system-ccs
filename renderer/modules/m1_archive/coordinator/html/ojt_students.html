<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJT Students</title>
    <link rel="stylesheet" href="../css/ojt_students.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-container">
      <!-- Main Content Background + Inner Layout -->
      <div class="content-bg">
        <!-- Section Title -->
        <h1 class="page-title">EXTERNAL PARTNERS</h1>

        <!-- Google Classroom–style cards row -->
        <div class="class-cards-row">
          <div class="class-card">
            <div class="card-header">
              <div class="card-title">BSIT-4B</div>
            </div>
            <div class="divider"></div>
            <div class="card-footer"><strong>36</strong> students</div>
          </div>

          <div class="class-card">
            <div class="card-header">
              <div class="card-title">BSIT-4D</div>
            </div>
            <div class="divider"></div>
            <div class="card-footer"><strong>36</strong> students</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.querySelectorAll(".student-card").forEach(function (card) {
        card.addEventListener("click", function () {
          let section = this.dataset.section;

          window.location.href =
            "ojt_students_list.html?section=" + encodeURIComponent(section);
        });
      });
    </script>
  </body>
</html>
