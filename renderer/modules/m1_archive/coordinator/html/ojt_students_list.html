<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJT List</title>

    <link rel="stylesheet" href="../css/ojt_list.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .search-bar {
        margin-bottom: 18px;
        margin-top: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .search-input {
        flex: 1;
        max-width: 320px;
        height: 38px;
        border-radius: 9px;
        border: 1px solid var(--border-color);
        background: var(--secondary-bg);
        color: var(--primary-text);
        padding: 0 14px;
        font-size: 13px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--accent-blue);
      }
      .student-count-badge {
        font-size: 12px;
        color: var(--secondary-text);
        padding: 5px 12px;
        border: 1px solid var(--border-color);
        border-radius: 99px;
      }
      .loading-state,
      .empty-state {
        color: var(--secondary-text);
        font-size: 14px;
        padding: 20px 0;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="page-title" id="pageTitle">OJT STUDENTS</h1>

      <div class="panel">
        <div class="panel-body">
          <div class="search-bar">
            <a href="ojt_students.html" class="back-btn">&#8249;</a>
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search student name or ID…"
            />
            <span class="student-count-badge" id="countBadge"></span>
          </div>

          <div id="cardsContainer" class="cards-container">
            <div class="loading-state">Loading students…</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const section = params.get("section") || "";
      const scope = String(params.get("scope") || "")
        .trim()
        .toLowerCase();
      const metric = String(params.get("metric") || "")
        .trim()
        .toLowerCase();
      const unresolvedRequirementStatuses = new Set([
        "",
        "pending",
        "submitted",
        "rejected",
      ]);
      let allStudents = [];

      if (scope === "all") {
        const metricLabel = getMetricLabel(metric);
        document.getElementById("pageTitle").textContent = metricLabel
          ? "OJT STUDENTS — " + metricLabel
          : "OJT STUDENTS — ALL ASSIGNED SECTIONS";
        const backBtn = document.querySelector(".back-btn");
        if (backBtn) {
          backBtn.href = "dashboard.html";
        }
      } else if (section) {
        document.getElementById("pageTitle").textContent =
          "OJT STUDENTS — " + section;
      }

      function statusClass(status) {
        const s = String(status || "")
          .toLowerCase()
          .trim();
        if (s.includes("complete")) return "ojt-complete";
        if (s === "deployed") return "deployed";
        if (s.includes("pre")) return "pre-deployment";
        return "pending";
      }

      function statusLabel(status) {
        return String(status || "Pending Requirements");
      }

      function normalizeStatus(status) {
        const normalized = String(status || "")
          .trim()
          .toLowerCase();
        if (!normalized) return "unknown";
        if (normalized === "ojt complete") return "ojt complete";
        return normalized;
      }

      function getMetricLabel(metricValue) {
        const labels = {
          deployed: "CURRENTLY DEPLOYED",
          undeployed: "UNDEPLOYED STUDENTS",
          pending_requirements: "PENDING REQUIREMENTS",
        };
        return (
          labels[
            String(metricValue || "")
              .trim()
              .toLowerCase()
          ] || ""
        );
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderCards(students) {
        const container = document.getElementById("cardsContainer");
        if (!students.length) {
          container.innerHTML =
            '<div class="empty-state">No students found.</div>';
          document.getElementById("countBadge").textContent = "0 students";
          return;
        }

        document.getElementById("countBadge").textContent =
          students.length + " student" + (students.length !== 1 ? "s" : "");

        container.innerHTML = students
          .map((s) => {
            const imgHtml = s.profile_image_url
              ? `<img src="${escapeHtml(s.profile_image_url)}" alt="avatar" />`
              : "";
            const sc = statusClass(s.status);
            return `
            <div
              class="student-card"
              data-student-id="${escapeHtml(s.student_id)}"
              data-section="${escapeAttr(s.section || section || "")}" 
              tabindex="0"
              role="button"
            >
              <div class="avatar">${imgHtml}</div>
              <div class="student-id">${escapeHtml(s.student_id)}</div>
              <div class="student-name">${escapeHtml(s.display_name || s.name || "")}</div>
              <div class="status ${sc}">${escapeHtml(statusLabel(s.status))}</div>
            </div>`;
          })
          .join("");

        container.querySelectorAll(".student-card").forEach(function (card) {
          card.addEventListener("click", function () {
            const studentId = this.dataset.studentId;
            const studentSection = this.dataset.section || section || "";
            window.location.href =
              "ojt_students_profile.html?student_id=" +
              encodeURIComponent(studentId) +
              "&section=" +
              encodeURIComponent(studentSection);
          });
        });
      }

      async function loadAllAssignedStudents(api) {
        const sectionResult = await api.getCoordinatorSections();
        if (!sectionResult?.success) {
          throw new Error(
            sectionResult?.message || "Failed to load assigned sections.",
          );
        }

        const sections = Array.isArray(sectionResult.sections)
          ? sectionResult.sections
          : [];
        if (!sections.length) {
          return [];
        }

        const perSection = await Promise.all(
          sections.map(async (item) => {
            const sectionName = String(item.section_name || "").trim();
            if (!sectionName) return [];

            const result = await api.getCoordinatorSectionStudents(sectionName);
            if (!result?.success) {
              throw new Error(
                result?.message ||
                  `Failed to load students for ${sectionName}.`,
              );
            }

            const students = Array.isArray(result.students)
              ? result.students
              : [];
            return students.map((student) => ({
              ...student,
              section: String(student.section || "").trim() || sectionName,
            }));
          }),
        );

        return perSection.flat();
      }

      async function hasPendingPreRequirements(api, studentId) {
        const id = String(studentId || "").trim();
        if (!id) return false;

        try {
          const result = await api.getStudentRequirements({
            studentId: id,
            type: "pre",
          });
          if (!result?.success) return false;

          const requirements = Array.isArray(result.requirements)
            ? result.requirements
            : [];
          return requirements.some((requirement) => {
            const template = requirement?.template || {};
            const submission = requirement?.submission || null;
            const isRequired =
              Number(template.is_required) === 1 ||
              template.is_required === true;
            if (!isRequired) return false;

            const status = String(submission?.status || "")
              .trim()
              .toLowerCase();
            return unresolvedRequirementStatuses.has(status);
          });
        } catch (_error) {
          return false;
        }
      }

      async function applyMetricFilter(api, students, metricValue) {
        const metricKey = String(metricValue || "")
          .trim()
          .toLowerCase();
        if (!metricKey) return students;

        if (metricKey === "deployed") {
          return students.filter(
            (student) => normalizeStatus(student.status) === "deployed",
          );
        }

        if (metricKey === "undeployed") {
          return students.filter((student) => {
            const normalized = normalizeStatus(student.status);
            return normalized !== "deployed" && normalized !== "ojt complete";
          });
        }

        if (metricKey === "pending_requirements") {
          const flags = await Promise.all(
            students.map(async (student) => {
              const studentId = String(
                student.student_id || student.studentId || "",
              ).trim();
              const hasPending = await hasPendingPreRequirements(
                api,
                studentId,
              );
              return hasPending;
            }),
          );

          return students.filter((_, index) => flags[index]);
        }

        return students;
      }

      async function loadStudents() {
        const container = document.getElementById("cardsContainer");
        const api = getApi();

        if (!section && scope !== "all") {
          container.innerHTML =
            '<div class="empty-state">No section specified.</div>';
          return;
        }

        try {
          if (scope === "all") {
            const loadedStudents = await loadAllAssignedStudents(api);
            allStudents = await applyMetricFilter(api, loadedStudents, metric);
          } else {
            const result = await api.getCoordinatorSectionStudents(section);
            if (!result?.success)
              throw new Error(result?.message || "Failed to load students.");

            allStudents = Array.isArray(result.students) ? result.students : [];
          }

          renderCards(allStudents);
        } catch (err) {
          container.innerHTML =
            '<div class="empty-state">Error: ' +
            escapeHtml(err.message) +
            "</div>";
        }
      }

      document
        .getElementById("searchInput")
        .addEventListener("input", function () {
          const q = this.value.trim().toLowerCase();
          if (!q) {
            renderCards(allStudents);
            return;
          }
          const filtered = allStudents.filter((s) => {
            const name = String(s.display_name || s.name || "").toLowerCase();
            const id = String(s.student_id || "").toLowerCase();
            return name.includes(q) || id.includes(q);
          });
          renderCards(filtered);
        });

      function getApi() {
        if (window.electronAPI) return window.electronAPI;
        try {
          if (
            window.parent &&
            window.parent !== window &&
            window.parent.electronAPI
          )
            return window.parent.electronAPI;
        } catch (_) {}
        try {
          if (window.top && window.top !== window && window.top.electronAPI)
            return window.top.electronAPI;
        } catch (_) {}
        return {};
      }

      loadStudents();
    </script>
  </body>
</html>
