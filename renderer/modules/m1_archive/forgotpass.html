<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - CCS System</title>
    <link rel="stylesheet" href="forgotpass.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-glow"></div>

    <div class="container">
      <div class="left-panel">
        <img
          id="departmentLogo"
          src="images/CCSLOGO.png"
          class="logo"
          alt="Department Logo"
        />

        <p class="welcome-text">Reset Your</p>
        <h1 class="title">
          PASSWORD<br />
          SECURELY
        </h1>

        <p class="description">
          Enter your email address and we'll send you a 6-digit OTP to reset
          your password.
        </p>

        <p class="school">PAMANTASAN NG LUNGSOD NG PASIG</p>
        <p class="college" id="departmentName">College of Computer Studies</p>
      </div>

      <div class="right-panel">
        <button class="back-btn" type="button" onclick="goBack()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <h2>Forgot Password</h2>

        <form id="emailForm">
          <div id="emailStep">
            <label for="email">E-MAIL ADDRESS</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />

            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>

            <button type="submit">SEND OTP</button>
          </div>
        </form>

        <section id="otpStep" style="display: none">
          <label for="otp">ENTER 6-DIGIT OTP</label>
          <input
            type="text"
            id="otp"
            placeholder="Enter the OTP sent to your email"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
          />

          <div id="otpErrorMessage" class="error"></div>
          <div id="otpSuccessMessage" class="success"></div>

          <button type="button" id="verifyOtpBtn">VERIFY OTP</button>
          <button type="button" id="resendOtpBtn" class="resend-btn">
            RESEND OTP
          </button>
        </section>

        <div class="back-to-login">
          <a href="#" onclick="goBack()">← Back to Login</a>
        </div>
      </div>
    </div>

    <div id="passwordModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Reset Password</h2>
        <form id="passwordResetForm">
          <label for="newPassword">NEW PASSWORD</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
          />

          <label for="confirmPassword">CONFIRM PASSWORD</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
          />

          <div id="passwordErrorMessage" class="error"></div>
          <div id="passwordSuccessMessage" class="success"></div>

          <button type="submit">RESET PASSWORD</button>
        </form>
      </div>
    </div>

    <script>
      let currentEmail = "";
      const APP_SETTINGS_KEY = "sas.app.settings";
      const DEFAULT_DEPARTMENT_NAME = "College of Computer Studies";
      const DEFAULT_DEPARTMENT_LOGO = "images/CCSLOGO.png";

      function applyDepartmentBranding(settings) {
        const department = settings?.department || {};
        const departmentName =
          String(department.department_name || "").trim() ||
          DEFAULT_DEPARTMENT_NAME;
        const logoUrl =
          String(department.logo_url || "").trim() || DEFAULT_DEPARTMENT_LOGO;

        const departmentNameEl = document.getElementById("departmentName");
        const departmentLogoEl = document.getElementById("departmentLogo");

        if (departmentNameEl) {
          departmentNameEl.textContent = departmentName;
        }

        if (departmentLogoEl) {
          departmentLogoEl.src = logoUrl;
          departmentLogoEl.onerror = function () {
            departmentLogoEl.src = DEFAULT_DEPARTMENT_LOGO;
          };
        }
      }

      function applyBrandingFromLocalSettings() {
        try {
          const raw = localStorage.getItem(APP_SETTINGS_KEY);
          if (!raw) {
            applyDepartmentBranding({});
            return;
          }

          const parsed = JSON.parse(raw);
          applyDepartmentBranding(parsed || {});
        } catch (_error) {
          applyDepartmentBranding({});
        }
      }

      async function refreshBrandingFromPersistedSettings() {
        if (
          !window.electronAPI ||
          typeof window.electronAPI.getAppSettings !== "function"
        ) {
          return;
        }

        try {
          const result = await window.electronAPI.getAppSettings();
          if (!result || !result.success || !result.settings) {
            return;
          }

          applyDepartmentBranding(result.settings);
          localStorage.setItem(
            APP_SETTINGS_KEY,
            JSON.stringify(result.settings),
          );
        } catch (_error) {
          // Keep already-applied local branding when API call fails.
        }
      }

      applyBrandingFromLocalSettings();
      refreshBrandingFromPersistedSettings();

      document.getElementById("otp").addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "");
      });

      document
        .getElementById("emailForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          document.getElementById("errorMessage").textContent = "";
          document.getElementById("successMessage").textContent = "";

          const email = document.getElementById("email").value.trim();
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          if (!emailRegex.test(email)) {
            document.getElementById("errorMessage").textContent =
              "Please enter a valid email address.";
            return;
          }

          try {
            const result = await sendOTP(email);

            if (!result.success) {
              document.getElementById("errorMessage").textContent =
                result.message || "Failed to send OTP. Please try again.";
              return;
            }

            currentEmail = email;
            document.getElementById("successMessage").textContent =
              "OTP sent! Please check your email.";
            document.getElementById("emailStep").style.display = "none";
            document.getElementById("otpStep").style.display = "block";
          } catch (error) {
            document.getElementById("errorMessage").textContent =
              "An error occurred. Please try again.";
          }
        });

      document
        .getElementById("verifyOtpBtn")
        .addEventListener("click", async function () {
          document.getElementById("otpErrorMessage").textContent = "";
          document.getElementById("otpSuccessMessage").textContent = "";

          const otp = document.getElementById("otp").value.trim();

          if (!/^[0-9]{6}$/.test(otp)) {
            document.getElementById("otpErrorMessage").textContent =
              "Please enter a valid 6-digit OTP.";
            return;
          }

          try {
            const result = await verifyOTP(currentEmail, otp);

            if (!result.success) {
              document.getElementById("otpErrorMessage").textContent =
                result.message || "Invalid OTP. Please try again.";
              return;
            }

            document.getElementById("otpSuccessMessage").textContent =
              "OTP verified successfully!";
            document.getElementById("otp").value = "";
            setTimeout(showPasswordModal, 500);
          } catch (error) {
            document.getElementById("otpErrorMessage").textContent =
              "An error occurred. Please try again.";
          }
        });

      document
        .getElementById("resendOtpBtn")
        .addEventListener("click", async function () {
          document.getElementById("otpErrorMessage").textContent = "";
          document.getElementById("otpSuccessMessage").textContent = "";

          try {
            const result = await sendOTP(currentEmail);

            if (!result.success) {
              document.getElementById("otpErrorMessage").textContent =
                result.message || "Failed to resend OTP. Please try again.";
              return;
            }

            document.getElementById("otpSuccessMessage").textContent =
              "OTP resent! Please check your email.";
          } catch (error) {
            document.getElementById("otpErrorMessage").textContent =
              "An error occurred. Please try again.";
          }
        });

      document
        .getElementById("passwordResetForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          document.getElementById("passwordErrorMessage").textContent = "";
          document.getElementById("passwordSuccessMessage").textContent = "";

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (newPassword.length < 8) {
            document.getElementById("passwordErrorMessage").textContent =
              "Password must be at least 8 characters long.";
            return;
          }

          if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(newPassword)) {
            document.getElementById("passwordErrorMessage").textContent =
              "Password must contain at least one uppercase letter, one lowercase letter, and one number.";
            return;
          }

          if (newPassword !== confirmPassword) {
            document.getElementById("passwordErrorMessage").textContent =
              "Passwords do not match.";
            return;
          }

          try {
            const result = await resetPassword(currentEmail, newPassword);

            if (!result.success) {
              document.getElementById("passwordErrorMessage").textContent =
                result.message || "Failed to reset password. Please try again.";
              return;
            }

            document.getElementById("passwordSuccessMessage").textContent =
              "Password reset successfully!";
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          } catch (error) {
            document.getElementById("passwordErrorMessage").textContent =
              "An error occurred. Please try again.";
          }
        });

      async function sendOTP(email) {
        try {
          return await window.electronAPI.sendOTP(email);
        } catch (error) {
          console.error("Send OTP error:", error);
          return { success: false, message: "Failed to send OTP." };
        }
      }

      async function verifyOTP(email, otp) {
        try {
          return await window.electronAPI.verifyOTP(email, otp);
        } catch (error) {
          console.error("Verify OTP error:", error);
          return { success: false, message: "Failed to verify OTP." };
        }
      }

      async function resetPassword(email, newPassword) {
        try {
          return await window.electronAPI.resetPassword(email, newPassword);
        } catch (error) {
          console.error("Reset password error:", error);
          return { success: false, message: "Failed to reset password." };
        }
      }

      function showPasswordModal() {
        document.getElementById("passwordModal").style.display = "block";
      }

      function closeModal() {
        document.getElementById("passwordModal").style.display = "none";
      }

      window.onclick = function (event) {
        const modal = document.getElementById("passwordModal");
        if (event.target === modal) {
          modal.style.display = "none";
        }
      };

      function goBack() {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
