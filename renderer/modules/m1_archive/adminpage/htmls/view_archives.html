<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Archives</title>
    <link rel="stylesheet" href="../css/view_archives.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div class="page">
      <h2 class="title">VIEW ARCHIVES</h2>

      <!-- FILTERS -->
      <div class="controls">
        <div class="left-controls">
          <div class="search-box">
            <input type="text" id="archive-search-input" placeholder="Search" />
          </div>

          <!-- FILTER -->
          <div class="filter-group">
            <button class="filter-toggle">
              Filter Option
              <i data-lucide="chevron-down" class="filter-arrow"></i>
            </button>

            <div class="filter-dropdown">
              <label
                ><input type="radio" name="course" value="" /> All
                Programs</label
              >
              <label
                ><input type="radio" name="course" value="BSIT" /> BSIT</label
              >
              <label
                ><input type="radio" name="course" value="BSCS" /> BSCS</label
              >
              <label
                ><input type="radio" name="sort" value="date" checked /> Date
                Published</label
              >
              <label><input type="radio" name="sort" value="az" /> A-Z</label>
              <label><input type="radio" name="sort" value="za" /> Z-A</label>
            </div>
          </div>

          <button class="filter-btn" id="apply-filter-btn" type="button">
            Filter
          </button>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="content">
        <!-- LEFT LIST -->
        <div class="archive-list" id="archive-list"></div>

        <!-- RIGHT PREVIEW -->
        <div class="preview">
          <div class="preview-box"></div>

          <div class="preview-pagination">
            <div class="pagination">
              <div class="tooltip">
                <button
                  class="download"
                  id="archive-download-btn"
                  type="button"
                >
                  <i data-lucide="download"></i>
                </button>
                <span class="tooltip-text">Download File</span>
              </div>
            </div>
            <button class="flip-card-btn" id="flip-preview-btn" type="button">
              Flip Card
            </button>
            <button class="viewfull-btn">See Full Document</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../api/view_archives_modal.js"></script>
    <script src="../api/view_archives_flipcard.js"></script>
    <script src="../api/view_archives.js"></script>
  </body>
</html>
