<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Section Assignment</title>
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/form_section_assignement.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="page">

    <h1 class="page-title">SECTION ASSIGNMENT</h1>

    <!-- Controls -->
    <div class="controls">

        <div class="left-controls">

            <!-- UPDATED SELECT -->
            <div class="select-wrapper">
                <select>
                    <option>Filter Option</option>
                    <option>Juan Delacruz</option>
                    <option>Maria Lopez</option>
                </select>
                <span class="arrow"></span>
            </div>

            <button class="filter-btn">Filter</button>
        </div>

        <!-- RIGHT BUTTONS -->
        <div class="right-controls">

            <div class="tooltip">
                <button class="generate-btn">
                    <i data-lucide="printer"></i>
                </button>
                <span class="tooltip-text">Generate Report</span>
            </div>

            <div class="tooltip">
                <button class="add-btn" id="assign-section-btn">+</button>
                <span class="tooltip-text">Assign Section</span>
            </div>

        </div>

    </div>

    <!-- DOWNLOAD OPTIONS MODAL -->
    <div id="export-modal" class="modal" style="display:none;">
        <div class="modal-content choice-modal-content">
            <div class="form-header">
                <h4>DOWNLOAD REPORT</h4>
            </div>
            <div class="choice-actions">
                <button type="button" class="choice-btn" id="export-csv-btn">
                    <i data-lucide="file-text"></i>
                    CSV
                </button>
                <button type="button" class="choice-btn" id="export-excel-btn">
                    <i data-lucide="sheet"></i>
                    Excel
                </button>
                <button type="button" class="choice-btn" id="export-pdf-btn">
                    <i data-lucide="file-output"></i>
                    PDF
                </button>
                <button type="button" class="choice-btn" id="export-doc-btn">
                    <i data-lucide="file"></i>
                    DOC
                </button>
            </div>
            <div class="form-actions choice-footer">
                <button class="cancel-btn" id="export-cancel-btn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal - Section Assigning Form -->
    <div id="section-assign-modal" class="modal section-assign-modal" style="display: none;">
        <div class="modal-content">
            <div class="form-header">SECTION ASSIGNING</div>
            
            <div class="form-body">
                <div class="input-group">
                    <label for="section-professor">PROFESSOR</label>
                    <div class="select-wrapper">
                        <select id="section-professor">
                            <option value="" disabled selected>Professor</option>
                            <option>Juan Delacruz</option>
                            <option>Maria Lopez</option>
                        </select>
                        <span class="arrow"></span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="section-name">SECTION</label>
                    <div class="select-wrapper">
                        <select id="section-name">
                            <option value="" disabled selected>Section</option>
                            <option>BSIT-3A</option>
                            <option>BSIT-3B</option>
                        </select>
                        <span class="arrow"></span>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-btn" id="section-cancel-btn">Cancel</button>
                <button type="button" class="save-btn" id="section-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" /></th>
                        <th>Section</th>
                        <th>Professor</th>
                        <th>Date Assigned</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td><input type="checkbox" /></td>
                        <td>BSIT-3B</td>
                        <td>Juan Delacruz</td>
                        <td>Feb.21,2026</td>
                        <td class="action-cell">
                            <div class="dropdown">
                                <button class="dots-btn">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                                <div class="dropdown-menu">
                                    <button>Edit</button>
                                    <button class="danger">Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td><input type="checkbox" /></td>
                        <td>BSIT-3A</td>
                        <td>Maria Lopez</td>
                        <td>Feb.22,2026</td>
                        <td class="action-cell">
                            <div class="dropdown">
                                <button class="dots-btn">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                                <div class="dropdown-menu">
                                    <button>Edit</button>
                                    <button class="danger">Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>

</div>

<script>
    lucide.createIcons();

    document.querySelectorAll(".dots-btn").forEach(btn => {
        btn.addEventListener("click", function (e) {
            e.stopPropagation();

            document.querySelectorAll(".dropdown-menu").forEach(menu => {
                menu.classList.remove("show");
            });

            this.nextElementSibling.classList.toggle("show");
        });
    });

    document.addEventListener("click", () => {
        document.querySelectorAll(".dropdown-menu").forEach(menu => {
            menu.classList.remove("show");
        });
    });

    // Export modal + downloads
    const exportModal = document.getElementById("export-modal");
    const exportCancelBtn = document.getElementById("export-cancel-btn");
    const exportCsvBtn = document.getElementById("export-csv-btn");
    const exportExcelBtn = document.getElementById("export-excel-btn");
    const exportPdfBtn = document.getElementById("export-pdf-btn");
    const exportDocBtn = document.getElementById("export-doc-btn");

    function openModal(modalEl) { modalEl.style.display = "flex"; }
    function closeModal(modalEl) { modalEl.style.display = "none"; }

    function getReportName() {
        const title = (document.querySelector(".page-title")?.textContent || "report")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "_");
        const date = new Date().toISOString().slice(0, 10);
        return `${title}_${date}`;
    }

    function getTable() {
        return document.querySelector("table");
    }

    function escapeCsvCell(value) {
        const s = String(value ?? "");
        if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
        return s;
    }

    function tableToCsv(table) {
        const rows = Array.from(table.querySelectorAll("tr"));
        return rows.map(row => {
            const cells = Array.from(row.querySelectorAll("th,td")).map(cell => {
                return escapeCsvCell(cell.textContent.trim());
            });
            return cells.join(",");
        }).join("\n");
    }

    function downloadBlob(content, mime, filename) {
        const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    function downloadTableAsHtmlDoc(table, filename, mime) {
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${table.outerHTML}</body></html>`;
        downloadBlob(html, mime, filename);
    }

    document.querySelector(".generate-btn").addEventListener("click", () => {
        openModal(exportModal);
        lucide.createIcons();
    });

    exportCancelBtn.addEventListener("click", () => closeModal(exportModal));
    exportModal.addEventListener("click", (e) => { if (e.target === exportModal) closeModal(exportModal); });

    exportCsvBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        const csv = tableToCsv(table);
        downloadBlob(csv, "text/csv;charset=utf-8", `${getReportName()}.csv`);
        closeModal(exportModal);
    });

    exportExcelBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        downloadTableAsHtmlDoc(table, `${getReportName()}.xls`, "application/vnd.ms-excel");
        closeModal(exportModal);
    });

    exportDocBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        downloadTableAsHtmlDoc(table, `${getReportName()}.doc`, "application/msword");
        closeModal(exportModal);
    });

    exportPdfBtn.addEventListener("click", () => {
        closeModal(exportModal);
        window.print();
    });

    const select = document.querySelector(".select-wrapper select");
    select.addEventListener("change", () => {
        select.blur();
    });


    // Section Assign Modal - open/close
    const sectionModal = document.getElementById("section-assign-modal");
    document.getElementById("assign-section-btn").addEventListener("click", () => {
        sectionModal.style.display = sectionModal.style.display === "none" || !sectionModal.style.display ? "flex" : "none";
    });

    document.getElementById("section-cancel-btn").addEventListener("click", () => {
        sectionModal.style.display = "none";
    });

    document.getElementById("section-save-btn").addEventListener("click", () => {
        const professor = document.getElementById("section-professor").value;
        const section = document.getElementById("section-name").value;
        if (professor && section) {
            // Optional: add row to table or submit data
            sectionModal.style.display = "none";
        }
    });
</script>

</body>
</html>
