<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coordinators Management</title>
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/form_user_management.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"> <!-- Font Awesome -->
</head>

<body>

<div class="page">

    <h1 class="page-title">COORDINATORS MANAGEMENT</h1>

    <!-- Controls -->
    <div class="controls">
        <div class="left-controls">
            <input type="text" placeholder="Search">
            <div class="select-wrapper">
                <select>
                    <option>Sort By</option>
                    <option>Name (A-Z)</option>
                    <option>Name (Z-A)</option>
                    <option>Status</option>
                </select>
                <span class="arrow"></span> <!-- Arrow Icon for Dropdown -->
            </div>
            <button class="filter-btn">Filter</button>
        </div>
        <div class="right-controls">
            <div class="tooltip">
                <button class="generate-btn">
                    <i data-lucide="printer"></i>
                </button>
                <span class="tooltip-text">Generate Report</span>
            </div>
            <div class="tooltip">
                <button class="add-btn" id="add-coordinator-btn">+</button>
                <span class="tooltip-text">Add Coordinator</span>
            </div>
        </div>
    </div>

    <!-- DOWNLOAD OPTIONS MODAL -->
    <div id="export-modal" class="modal" style="display:none;">
        <div class="modal-content choice-modal-content">
            <div class="form-header">
                <h4>DOWNLOAD REPORT</h4>
            </div>
            <div class="choice-actions">
                <button type="button" class="choice-btn" id="export-csv-btn">
                    <i data-lucide="file-text"></i>
                    CSV
                </button>
                <button type="button" class="choice-btn" id="export-excel-btn">
                    <i data-lucide="sheet"></i>
                    Excel
                </button>
                <button type="button" class="choice-btn" id="export-pdf-btn">
                    <i data-lucide="file-output"></i>
                    PDF
                </button>
                <button type="button" class="choice-btn" id="export-doc-btn">
                    <i data-lucide="file"></i>
                    DOC
                </button>
            </div>
            <div class="form-actions choice-footer">
                <button class="cancel-btn" id="export-cancel-btn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <!-- SELECT ADD MODE MODAL -->
    <div id="select-mode-modal" class="modal" style="display:none;">
        <div class="modal-content choice-modal-content">
            <div class="form-header">
                <h4>ADD COORDINATOR</h4>
            </div>

            <div class="choice-actions">
                <button type="button" class="choice-btn" id="manual-add-btn">
                    <i data-lucide="file-plus-2"></i>
                    Add manually
                </button>

                <button type="button" class="choice-btn" id="csv-add-btn">
                    <i data-lucide="upload"></i>
                    Upload CSV file
                </button>

                <input type="file" id="csv-file-input" accept=".csv,text/csv" style="display:none;">
            </div>

            <div class="form-actions choice-footer">
                <button class="cancel-btn" id="cancel-mode-btn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal - Add/Update Coordinator Form -->
    <div id="add-coordinator-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="form-header">
                <h4 id="modal-title">ADDING NEW COORDINATOR</h4> <!-- Default title is "Adding New Coordinator" -->
            </div>

            <div class="form-body">
                <div class="input-row">
                    <div class="input-group">
                        <label for="employee-id">EMPLOYEE ID</label>
                        <input type="text" id="employee-id" placeholder="e.g. 00-0000" />
                    </div>
                    <div class="input-group">
                        <label for="profile">
                            <i class="fa fa-upload" aria-hidden="true"></i> UPLOAD PROFILE
                        </label>
                        <input type="file" id="profile" />
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="name">NAME</label>
                        <input type="text" id="name" placeholder="Type here" class="required-field" />
                        <div class="error-msg">Required field.</div>
                    </div>
                    <div class="input-group">
                        <label for="username">USERNAME</label>
                        <input type="text" id="username" placeholder="surname_00000" class="required-field" />
                        <div class="error-msg">Required field.</div>
                    </div>
                </div>

                <div class="input-row">
                    <!-- Password Field -->
                    <div class="input-group password-wrapper">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" placeholder="Type here" class="required-field" />
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <svg id="password-eye" width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                                      stroke="currentColor"
                                      stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor"
                                        stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group password-wrapper">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" placeholder="Type here" class="required-field" />
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">
                            <svg id="confirm-password-eye" width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                                      stroke="currentColor"
                                      stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor"
                                        stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="status" placeholder="Status" class="required field"> </label>
                        <div class="select-wrapper">
                            <select id="status">
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>
                            <span class="arrowstatus"></span> <!-- Arrow Icon for Dropdown -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel-btn" id="cancel-btn">Cancel</button>
                <button class="save-btn" id="save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" /></th>
                        <th>ID</th>
                        <th>Profile</th>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="row-001">
                        <td><input type="checkbox" /></td>
                        <td>001</td>
                        <td><img src="../images/company1.png" class="company-logo"></td>
                        <td>Juan Delacruz</td>
                        <td>delacruz_001</td>
                        <td>****</td>
                        <td><span class="status active">Active</span></td>
                        <td class="action-cell">
                            <div class="dropdown">
                                <button class="dots-btn">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                                <div class="dropdown-menu">
                                    <button class="edit-btn" type="button">Edit</button>
                                    <button class="danger">Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr id="row-002">
                        <td><input type="checkbox" /></td>
                        <td>002</td>
                        <td><img src="../images/company1.png" class="company-logo"></td>
                        <td>Maria Lopez</td>
                        <td>lopez_002</td>
                        <td>****</td>
                        <td><span class="status inactive">Inactive</span></td>
                        <td class="action-cell">
                            <div class="dropdown">
                                <button class="dots-btn">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                                <div class="dropdown-menu">
                                    <button class="edit-btn" type="button">Edit</button>
                                    <button class="danger">Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    lucide.createIcons();

    document.querySelectorAll(".dots-btn").forEach(btn => {
        btn.addEventListener("click", function (e) {
            e.stopPropagation();

            document.querySelectorAll(".dropdown-menu").forEach(menu => {
                menu.classList.remove("show");
            });

            this.nextElementSibling.classList.toggle("show");
        });
    });

    document.addEventListener("click", () => {
        document.querySelectorAll(".dropdown-menu").forEach(menu => {
            menu.classList.remove("show");
        });
    });

    // Export modal + downloads
    const exportModal = document.getElementById("export-modal");
    const exportCancelBtn = document.getElementById("export-cancel-btn");
    const exportCsvBtn = document.getElementById("export-csv-btn");
    const exportExcelBtn = document.getElementById("export-excel-btn");
    const exportPdfBtn = document.getElementById("export-pdf-btn");
    const exportDocBtn = document.getElementById("export-doc-btn");

    function openModal(el) { el.style.display = "flex"; }
    function closeModal(el) { el.style.display = "none"; }

    function getReportName() {
        const title = (document.querySelector(".page-title")?.textContent || "report")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "_");
        const date = new Date().toISOString().slice(0, 10);
        return `${title}_${date}`;
    }

    function getTable() {
        return document.querySelector("table");
    }

    function escapeCsvCell(value) {
        const s = String(value ?? "");
        if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
        return s;
    }

    function tableToCsv(table) {
        const rows = Array.from(table.querySelectorAll("tr"));
        return rows.map(row => {
            const cells = Array.from(row.querySelectorAll("th,td")).map(cell => {
                return escapeCsvCell(cell.textContent.trim());
            });
            return cells.join(",");
        }).join("\n");
    }

    function downloadBlob(content, mime, filename) {
        const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    function downloadTableAsHtmlDoc(table, filename, mime) {
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${table.outerHTML}</body></html>`;
        downloadBlob(html, mime, filename);
    }

    document.querySelector(".generate-btn").addEventListener("click", () => {
        openModal(exportModal);
        lucide.createIcons();
    });

    exportCancelBtn.addEventListener("click", () => closeModal(exportModal));
    exportModal.addEventListener("click", (e) => { if (e.target === exportModal) closeModal(exportModal); });

    exportCsvBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        const csv = tableToCsv(table);
        downloadBlob(csv, "text/csv;charset=utf-8", `${getReportName()}.csv`);
        closeModal(exportModal);
    });

    exportExcelBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        downloadTableAsHtmlDoc(table, `${getReportName()}.xls`, "application/vnd.ms-excel");
        closeModal(exportModal);
    });

    exportDocBtn.addEventListener("click", () => {
        const table = getTable();
        if (!table) return;
        downloadTableAsHtmlDoc(table, `${getReportName()}.doc`, "application/msword");
        closeModal(exportModal);
    });

    exportPdfBtn.addEventListener("click", () => {
        closeModal(exportModal);
        window.print();
    });

    const selectModeModal = document.getElementById("select-mode-modal");
    const formModal = document.getElementById("add-coordinator-modal");
    const csvInput = document.getElementById("csv-file-input");
    const modalTitle = document.getElementById("modal-title");

    const employeeIdEl = document.getElementById("employee-id");
    const nameEl = document.getElementById("name");
    const usernameEl = document.getElementById("username");
    const statusEl = document.getElementById("status");

    let editingRow = null;

    function openModal(el) { el.style.display = "flex"; }
    function closeModal(el) { el.style.display = "none"; }

    function resetForm() {
        employeeIdEl.value = "";
        nameEl.value = "";
        usernameEl.value = "";
        document.getElementById("password").value = "";
        document.getElementById("confirm-password").value = "";
        statusEl.value = "Active";
        document.getElementById("profile").value = "";
    }

    function getNextId() {
        const tbody = document.querySelector("table tbody");
        const ids = Array.from(tbody.querySelectorAll("tr td:nth-child(2)"))
            .map(td => parseInt(td.textContent, 10))
            .filter(n => Number.isFinite(n));
        const next = (ids.length ? Math.max(...ids) : 0) + 1;
        return String(next).padStart(3, "0");
    }

    // Add (+) now opens options modal
    document.getElementById("add-coordinator-btn").addEventListener("click", () => openModal(selectModeModal));
    document.getElementById("cancel-mode-btn").addEventListener("click", () => closeModal(selectModeModal));

    document.getElementById("manual-add-btn").addEventListener("click", () => {
        closeModal(selectModeModal);
        editingRow = null;
        modalTitle.innerText = "ADDING NEW COORDINATOR";
        resetForm();
        openModal(formModal);
    });

    document.getElementById("csv-add-btn").addEventListener("click", () => {
        csvInput.value = "";
        csvInput.click();
    });

    // Close the modal when the cancel button is clicked
    document.getElementById("cancel-btn").addEventListener("click", () => {
        closeModal(formModal);
    });

    function setStatusCell(td, statusText) {
        const st = String(statusText || "").trim().toLowerCase();
        const cls = st === "inactive" ? "inactive" : "active";
        const label = cls === "inactive" ? "Inactive" : "Active";
        td.innerHTML = `<span class="status ${cls}">${label}</span>`;
    }

    function addRow({ id, name, username, status }) {
        const tbody = document.querySelector("table tbody");
        const tr = document.createElement("tr");
        const safeId = id || getNextId();
        tr.id = `row-${safeId}`;
        tr.innerHTML = `
            <td><input type="checkbox" /></td>
            <td>${safeId}</td>
            <td><img src="../images/company1.png" class="company-logo"></td>
            <td>${name || ""}</td>
            <td>${username || ""}</td>
            <td>****</td>
            <td></td>
            <td class="action-cell">
                <div class="dropdown">
                    <button class="dots-btn" type="button">
                        <i data-lucide="more-vertical"></i>
                    </button>
                    <div class="dropdown-menu">
                        <button class="edit-btn" type="button">Edit</button>
                        <button class="danger" type="button">Delete</button>
                    </div>
                </div>
            </td>
        `;
        setStatusCell(tr.cells[6], status);
        tbody.appendChild(tr);
        lucide.createIcons();
    }

    // Edit (delegated)
    document.addEventListener("click", (e) => {
        const editBtn = e.target.closest(".edit-btn");
        if (!editBtn) return;
        const row = editBtn.closest("tr");
        if (!row) return;

        editingRow = row;
        modalTitle.innerText = "EDIT COORDINATOR";

        employeeIdEl.value = row.cells[1]?.textContent.trim() || "";
        nameEl.value = row.cells[3]?.textContent.trim() || "";
        usernameEl.value = row.cells[4]?.textContent.trim() || "";
        const st = row.cells[6]?.textContent.trim() || "Active";
        statusEl.value = st;

        document.getElementById("password").value = "";
        document.getElementById("confirm-password").value = "";
        document.getElementById("profile").value = "";

        closeModal(selectModeModal);
        openModal(formModal);
    });

    // Save (add new or update)
    document.getElementById("save-btn").addEventListener("click", () => {
        const name = nameEl.value.trim();
        const username = usernameEl.value.trim();
        const status = statusEl.value;

        if (editingRow) {
            // keep ID column
            editingRow.cells[3].textContent = name;
            editingRow.cells[4].textContent = username;
            setStatusCell(editingRow.cells[6], status);
        } else {
            addRow({
                name,
                username,
                status,
            });
        }

        closeModal(formModal);
    });

    function parseCsvRow(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    cur += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
                continue;
            }
            if (ch === "," && !inQuotes) {
                out.push(cur.trim());
                cur = "";
                continue;
            }
            cur += ch;
        }
        out.push(cur.trim());
        return out.map(v => v.replace(/^"|"$/g, "").trim());
    }

    function normalizeHeader(h) {
        return String(h || "").trim().toLowerCase().replace(/\s+/g, " ").replace(/[._-]/g, " ");
    }

    csvInput.addEventListener("change", async () => {
        const file = csvInput.files && csvInput.files[0];
        if (!file) return;
        const isCsv = file.type === "text/csv" || file.name.toLowerCase().endsWith(".csv");
        if (!isCsv) {
            alert("Please select a CSV file.");
            return;
        }

        closeModal(selectModeModal);

        const text = await file.text();
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) {
            alert("CSV is empty.");
            return;
        }

        const firstRow = parseCsvRow(lines[0]);
        const hasHeader = firstRow.some(v => /[a-zA-Z]/.test(v));
        let headers = [];
        let startIdx = 0;
        if (hasHeader) {
            headers = firstRow.map(normalizeHeader);
            startIdx = 1;
        }

        const headerIndex = (names) => {
            if (!headers.length) return -1;
            const set = new Set(names.map(normalizeHeader));
            return headers.findIndex(h => set.has(h));
        };

        const idx = {
            id: headerIndex(["id"]),
            name: headerIndex(["name"]),
            username: headerIndex(["username"]),
            status: headerIndex(["status"]),
        };

        let imported = 0;
        for (let i = startIdx; i < lines.length; i++) {
            const cols = parseCsvRow(lines[i]);
            if (cols.every(c => !c)) continue;

            // No header fallback order: Name, Username, Status, (optional) ID
            const row = headers.length
                ? {
                    id: idx.id >= 0 ? cols[idx.id] : "",
                    name: idx.name >= 0 ? cols[idx.name] : "",
                    username: idx.username >= 0 ? cols[idx.username] : "",
                    status: idx.status >= 0 ? cols[idx.status] : "Active",
                }
                : {
                    name: cols[0] || "",
                    username: cols[1] || "",
                    status: cols[2] || "Active",
                    id: cols[3] || "",
                };

            addRow(row);
            imported++;
        }

        alert(imported ? `Imported ${imported} row(s) from CSV.` : "No rows imported. Check your CSV format.");
    });

    // Backdrop/Esc close
    [selectModeModal, formModal].forEach((m) => {
        m.addEventListener("click", (e) => {
            if (e.target === m) closeModal(m);
        });
    });
    document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        closeModal(selectModeModal);
        closeModal(formModal);
    });

    // Toggle password visibility
    function togglePassword(fieldId) {
        const password = document.getElementById(fieldId);
        const eyeIcon = document.getElementById(fieldId === 'password' ? 'password-eye' : 'confirm-password-eye');

        if (password.type === "password") {
            password.type = "text";
            eyeIcon.innerHTML = `
                <path d="M17.94 17.94C16.12 19.24 14.11 20 12 20C5 20 1 12 1 12C2.18 9.61 3.83 7.56 5.77 6.11M9.88 9.88C9.32 10.44 9 11.19 9 12C9 13.66 10.34 15 12 15C12.81 15 13.56 14.68 14.12 14.12M1 1L23 23"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
            `;
        } else {
            password.type = "password";
            eyeIcon.innerHTML = `
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
              stroke="currentColor"
              stroke-width="2"/>
                <circle cx="12" cy="12" r="3"
                        stroke="currentColor"
                        stroke-width="2"/>
            `;
        }
    }
</script>

</body>
</html>
