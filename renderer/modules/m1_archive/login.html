<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thesis/Capstone Login</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Background Glow -->
    <div class="background-glow"></div>

    <div class="container">
      <!-- Left Panel -->
      <div class="left-panel">
        <img
          id="departmentLogo"
          src="images/CCSLOGO.png"
          class="logo"
          alt="Department Logo"
        />

        <p class="welcome-text">Welcome to</p>
        <h1 class="title">
          THESIS/CAPSTONE<br />
          ARCHIVING AND<br />
          HOST TRAINING<br />
          ESTABLISHMENT (HTE)<br />
          FOR <span id="departmentCode">CCS</span> GRADUATING<br />
          STUDENTS
        </h1>

        <p class="school">PAMANTASAN NG LUNGSOD NG PASIG</p>
        <p class="college" id="departmentName">College of Computer Studies</p>
      </div>

      <!-- Right Panel -->
      <div class="right-panel">
        <!-- Back Button -->
        <button class="back-btn" onclick="goBack()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <h2>Login</h2>

        <form id="loginForm">
          <label>E-MAIL</label>
          <input type="text" id="username" required />

          <label>PASSWORD</label>

          <!-- Password Wrapper with Eye -->
          <div class="password-wrapper">
            <input type="password" id="password" required />

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword()"
            >
              <svg
                id="eyeIcon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
          </div>

          <label class="remember-row" for="rememberMe">
            <input type="checkbox" id="rememberMe" />
            <span>Remember me</span>
          </label>

          <a href="forgotpass.html" class="forgot">forgot password?</a>

          <div id="errorMessage" class="error"></div>

          <button id="loginSubmitBtn" type="submit">LOGIN</button>
        </form>
      </div>
    </div>

    <div id="superAdminModal" class="secret-modal" aria-hidden="true">
      <div class="secret-modal-card" role="dialog" aria-modal="true">
        <button
          id="superAdminCloseBtn"
          class="secret-close-btn"
          type="button"
          aria-label="Close secret login"
        >
          x
        </button>
        <h3>Super Admin Access</h3>
        <p class="secret-subtitle">
          Authorized account can sign in across all departments.
        </p>

        <form id="superAdminForm">
          <label for="superAdminEmail">E-MAIL</label>
          <input
            id="superAdminEmail"
            type="email"
            autocomplete="off"
            required
          />

          <label for="superAdminPassword">PASSWORD</label>
          <input
            id="superAdminPassword"
            type="password"
            autocomplete="off"
            required
          />

          <div id="superAdminError" class="error"></div>
          <button type="submit">LOGIN AS SUPER ADMIN</button>
        </form>
      </div>
    </div>

    <script>
      const REMEMBER_EMAIL_KEY = "rememberedEmail";
      const REMEMBER_ME_KEY = "rememberMeEnabled";
      const APP_SETTINGS_KEY = "sas.app.settings";
      const DEFAULT_DEPARTMENT_CODE = "CCS";
      const DEFAULT_DEPARTMENT_NAME = "College of Computer Studies";
      const DEFAULT_DEPARTMENT_LOGO = "images/CCSLOGO.png";
      const SECRET_HOLD_MS = 3000;
      const SECRET_CONFIRM_WINDOW_MS = 2500;

      let secretHoldTimer = null;
      let secretConfirmTimer = null;
      let secretHoldTriggered = false;

      function loadRememberedLogin() {
        const rememberMeEl = document.getElementById("rememberMe");
        const usernameEl = document.getElementById("username");
        const rememberedEnabled =
          localStorage.getItem(REMEMBER_ME_KEY) === "true";
        const rememberedEmail = localStorage.getItem(REMEMBER_EMAIL_KEY) || "";

        rememberMeEl.checked = rememberedEnabled;
        if (rememberedEnabled && rememberedEmail) {
          usernameEl.value = rememberedEmail;
        }
      }

      function applyDepartmentBranding(settings) {
        const department = settings?.department || {};

        const departmentCode =
          String(department.department_code || "").trim() ||
          DEFAULT_DEPARTMENT_CODE;
        const departmentName =
          String(department.department_name || "").trim() ||
          DEFAULT_DEPARTMENT_NAME;
        const logoUrl =
          String(department.logo_url || "").trim() || DEFAULT_DEPARTMENT_LOGO;

        const departmentCodeEl = document.getElementById("departmentCode");
        const departmentNameEl = document.getElementById("departmentName");
        const departmentLogoEl = document.getElementById("departmentLogo");

        if (departmentCodeEl) {
          departmentCodeEl.textContent = departmentCode;
        }

        if (departmentNameEl) {
          departmentNameEl.textContent = departmentName;
        }

        if (departmentLogoEl) {
          departmentLogoEl.src = logoUrl;
          departmentLogoEl.onerror = function () {
            departmentLogoEl.src = DEFAULT_DEPARTMENT_LOGO;
          };
        }
      }

      function applyBrandingFromLocalSettings() {
        try {
          const raw = localStorage.getItem(APP_SETTINGS_KEY);
          if (!raw) {
            applyDepartmentBranding({});
            return;
          }

          const parsed = JSON.parse(raw);
          applyDepartmentBranding(parsed || {});
        } catch (_error) {
          applyDepartmentBranding({});
        }
      }

      async function refreshBrandingFromPersistedSettings() {
        if (
          !window.electronAPI ||
          typeof window.electronAPI.getAppSettings !== "function"
        ) {
          return;
        }

        try {
          const result = await window.electronAPI.getAppSettings();
          if (!result || !result.success || !result.settings) {
            return;
          }

          applyDepartmentBranding(result.settings);
          localStorage.setItem(
            APP_SETTINGS_KEY,
            JSON.stringify(result.settings),
          );
        } catch (_error) {
          // Keep already-applied local branding when API call fails.
        }
      }

      function getSelectedDepartmentCode() {
        const fromHeading = String(
          document.getElementById("departmentCode")?.textContent || "",
        )
          .trim()
          .toUpperCase();
        if (fromHeading) return fromHeading;

        try {
          const raw = localStorage.getItem(APP_SETTINGS_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          const code = String(parsed?.department?.department_code || "")
            .trim()
            .toUpperCase();
          return code || DEFAULT_DEPARTMENT_CODE;
        } catch (_error) {
          return DEFAULT_DEPARTMENT_CODE;
        }
      }

      async function attemptLogin(
        email,
        password,
        rememberMe,
        errorElementId,
        isSecretLogin = false,
      ) {
        const selectedDepartmentCode = getSelectedDepartmentCode();
        const departmentCodeForRequest = isSecretLogin
          ? `SECRET:${selectedDepartmentCode}`
          : selectedDepartmentCode;
        const errorEl = document.getElementById(errorElementId);
        if (errorEl) errorEl.textContent = "";

        const result = await window.electronAPI.login(
          String(email || "").trim(),
          String(password || ""),
          departmentCodeForRequest,
          Boolean(isSecretLogin),
        );

        if (!result || !result.success) {
          if (errorEl) {
            errorEl.textContent =
              result?.message || "An error occurred during login.";
          }
          return;
        }

        if (rememberMe) {
          localStorage.setItem(REMEMBER_ME_KEY, "true");
          localStorage.setItem(REMEMBER_EMAIL_KEY, String(email || "").trim());
        } else {
          localStorage.removeItem(REMEMBER_ME_KEY);
          localStorage.removeItem(REMEMBER_EMAIL_KEY);
        }

        localStorage.setItem("user", JSON.stringify(result.user));

        if (
          result.user.role === "admin" ||
          result.user.role === "coordinator"
        ) {
          window.location.href = "adminpage/htmls/1main_menu.html";
          return;
        }

        if (errorEl) errorEl.textContent = "Role not recognized.";
      }

      function openSecretModal() {
        const modal = document.getElementById("superAdminModal");
        const emailEl = document.getElementById("superAdminEmail");
        const passwordEl = document.getElementById("superAdminPassword");
        const errorEl = document.getElementById("superAdminError");

        if (!modal) return;
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");

        if (errorEl) errorEl.textContent = "";
        if (emailEl) emailEl.value = "";
        if (passwordEl) passwordEl.value = "";

        window.setTimeout(() => {
          if (emailEl) emailEl.focus();
        }, 0);
      }

      function closeSecretModal() {
        const modal = document.getElementById("superAdminModal");
        if (!modal) return;
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
      }

      function clearSecretHold() {
        if (secretHoldTimer) {
          window.clearTimeout(secretHoldTimer);
          secretHoldTimer = null;
        }
      }

      function clearSecretConfirmWindow() {
        if (secretConfirmTimer) {
          window.clearTimeout(secretConfirmTimer);
          secretConfirmTimer = null;
        }
      }

      function resetSecretGestureState() {
        clearSecretHold();
        clearSecretConfirmWindow();
        secretHoldTriggered = false;
      }

      function bindSecretHoldTrigger() {
        const loginBtn = document.getElementById("loginSubmitBtn");
        if (!loginBtn) return;

        loginBtn.addEventListener("pointerdown", (event) => {
          if (!event.shiftKey) {
            resetSecretGestureState();
            return;
          }

          clearSecretHold();
          secretHoldTimer = window.setTimeout(() => {
            secretHoldTriggered = true;

            clearSecretConfirmWindow();
            secretConfirmTimer = window.setTimeout(() => {
              secretHoldTriggered = false;
            }, SECRET_CONFIRM_WINDOW_MS);
          }, SECRET_HOLD_MS);
        });

        const cancelHold = () => clearSecretHold();
        loginBtn.addEventListener("pointerup", cancelHold);
        loginBtn.addEventListener("pointerleave", cancelHold);
        loginBtn.addEventListener("pointercancel", cancelHold);

        loginBtn.addEventListener("dblclick", (event) => {
          if (!secretHoldTriggered || !event.shiftKey) return;

          event.preventDefault();
          event.stopPropagation();
          resetSecretGestureState();
          openSecretModal();
        });

        loginBtn.addEventListener("click", (event) => {
          if (!secretHoldTriggered) return;
          event.preventDefault();
          event.stopPropagation();
        });

        document.addEventListener("keyup", (event) => {
          if (event.key === "Shift") clearSecretHold();
        });
      }

      // Login Logic
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          if (secretHoldTriggered) {
            secretHoldTriggered = false;
            return;
          }

          const email = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          const rememberMe = document.getElementById("rememberMe").checked;

          await attemptLogin(
            email,
            password,
            rememberMe,
            "errorMessage",
            false,
          );
        });

      document
        .getElementById("superAdminForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("superAdminEmail")?.value;
          const password = document.getElementById("superAdminPassword")?.value;

          await attemptLogin(email, password, false, "superAdminError", true);
        });

      document
        .getElementById("superAdminCloseBtn")
        ?.addEventListener("click", closeSecretModal);

      document
        .getElementById("superAdminModal")
        ?.addEventListener("click", function (event) {
          if (event.target === this) closeSecretModal();
        });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSecretModal();
      });

      loadRememberedLogin();
      applyBrandingFromLocalSettings();
      refreshBrandingFromPersistedSettings();
      bindSecretHoldTrigger();

      // Back Button
      function goBack() {
        window.location.href = "../../core/index.html";
      }

      // Show/Hide Password
      function togglePassword() {
        const password = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (password.type === "password") {
          password.type = "text";
          eyeIcon.innerHTML = `
                <path d="M17.94 17.94C16.12 19.24 14.11 20 12 20C5 20 1 12 1 12C2.18 9.61 3.83 7.56 5.77 6.11M9.88 9.88C9.32 10.44 9 11.19 9 12C9 13.66 10.34 15 12 15C12.81 15 13.56 14.68 14.12 14.12M1 1L23 23"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            `;
        } else {
          password.type = "password";
          eyeIcon.innerHTML = `
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                      stroke="currentColor"
                      stroke-width="2"/>
                <circle cx="12" cy="12" r="3"
                        stroke="currentColor"
                        stroke-width="2"/>
            `;
        }
      }
    </script>
  </body>
</html>
