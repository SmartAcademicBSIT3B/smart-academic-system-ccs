<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Smart Academic System</title>

    <link rel="stylesheet" href="./landingpage.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
  </head>

  <body>
    <!-- 🔥 LOADING SCREEN -->
    <div id="loading-screen">
      <img src="./images/logo.png" alt="Logo" class="loading-logo" />
    </div>

    <!-- ✅ MAIN LANDING PAGE -->
    <div class="landing-page" id="main-content">
      <button
        id="landing-settings-btn"
        class="settings-btn"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M19.4 15.1c.14.31.1.67-.1.95l-1.2 1.65c-.22.3-.58.45-.94.4l-1.9-.24a7.73 7.73 0 0 1-1.02.59l-.68 1.78a.98.98 0 0 1-.9.63h-2.04a.98.98 0 0 1-.9-.63l-.68-1.78c-.36-.16-.7-.36-1.02-.59l-1.9.24a1 1 0 0 1-.94-.4l-1.2-1.65a.99.99 0 0 1-.1-.95l.78-1.74a7.9 7.9 0 0 1 0-1.18l-.78-1.74a.99.99 0 0 1 .1-.95l1.2-1.65a1 1 0 0 1 .94-.4l1.9.24c.31-.23.66-.43 1.02-.59l.68-1.78c.14-.38.5-.63.9-.63h2.04c.41 0 .77.25.9.63l.68 1.78c.36.16.7.36 1.02.59l1.9-.24c.36-.05.72.1.94.4l1.2 1.65c.2.28.24.64.1.95l-.78 1.74c.05.39.05.79 0 1.18l.78 1.74Z"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <!-- BACKGROUND -->
      <img class="bg-image" src="./images/plp_courtyard.jpg" alt="" />
      <div class="overlay"></div>

      <!-- LOGOS -->
      <div class="logos">
        <img src="./images/PASIG.png" alt="" />
        <img src="./images/PLPLOGO.png" alt="" />
        <img src="./images/CCSLOGO.png" alt="" />
      </div>

      <!-- TEXT CONTENT -->
      <div class="content">
        <p class="sub">PAMANTASAN NG LUNGSOD NG PASIG’S</p>

        <h1>
          THESIS/CAPSTONE <br />
          ARCHIVING AND <br />
          HOST TRAINING <br />
          ESTABLISHMENT (HTE)
        </h1>

        <button class="login-btn" type="button">LOGIN</button>
      </div>
    </div>

    <div
      id="offline-modal"
      class="offline-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="offline-title"
    >
      <div class="offline-modal-content">
        <h3 id="offline-title">No Internet Connection</h3>
        <p>
          This app requires an internet connection before you can continue.
          Please connect your device and try again.
        </p>
        <div class="offline-modal-actions">
          <button
            id="offline-retry-btn"
            class="offline-retry-btn"
            type="button"
          >
            Retry Connection
          </button>
        </div>
      </div>
    </div>

    <!-- ⏳ SCRIPT -->
    <script>
      window.addEventListener("load", function () {
        const loadingScreen = document.getElementById("loading-screen");
        const mainContent = document.getElementById("main-content");
        const loginBtn = document.querySelector(".login-btn");
        const offlineModal = document.getElementById("offline-modal");
        const offlineRetryBtn = document.getElementById("offline-retry-btn");
        let revealTimer = null;

        function showOfflineBlocker() {
          if (revealTimer) {
            window.clearTimeout(revealTimer);
            revealTimer = null;
          }
          loadingScreen.classList.add("hidden");
          mainContent.classList.remove("is-visible");
          offlineModal.classList.add("is-open");
        }

        function revealLandingPage() {
          if (mainContent.classList.contains("is-visible")) return;
          if (revealTimer) return;

          revealTimer = window.setTimeout(function () {
            loadingScreen.classList.add("hidden");
            mainContent.classList.add("is-visible");
            offlineModal.classList.remove("is-open");
            revealTimer = null;
          }, 2200);
        }

        function enforceConnectivity() {
          if (!navigator.onLine) {
            showOfflineBlocker();
            return false;
          }

          offlineModal.classList.remove("is-open");
          revealLandingPage();
          return true;
        }

        enforceConnectivity();

        window.addEventListener("offline", showOfflineBlocker);
        window.addEventListener("online", enforceConnectivity);
        offlineRetryBtn.addEventListener("click", enforceConnectivity);

        loginBtn.addEventListener("click", function (event) {
          if (!navigator.onLine) {
            event.preventDefault();
            showOfflineBlocker();
            return;
          }

          document.body.classList.add("page-exit");
          window.setTimeout(function () {
            window.location.href = "login.html";
          }, 420);
        });
      });
    </script>
  </body>
</html>
